<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BLEUPrint: Digital Financial Literacy Board Game | Sovereign Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* Prevent accidental text selection on buttons */
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Poppins', sans-serif;
            background: #050a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Enhanced animated gradient background */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, #0a0f2a, #020617);
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(45deg, rgba(0,255,204,0.02) 0px, rgba(0,255,204,0.02) 2px, transparent 2px, transparent 8px);
            animation: slowDrift 40s linear infinite;
            pointer-events: none;
        }

        @keyframes slowDrift {
            0% { transform: translate(0,0) rotate(0deg); }
            100% { transform: translate(-10%, -10%) rotate(2deg); }
        }

        .game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(0px);
        }

        /* TOP BAR - Sleek & Compact */
        .top-bar {
            background: rgba(6, 10, 30, 0.85);
            backdrop-filter: blur(12px);
            padding: 12px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(0, 255, 204, 0.6);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            z-index: 20;
        }

        .game-title {
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00ffcc, #6c5ce7, #ff79c6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            cursor: pointer;
            transition: 0.2s;
            text-shadow: 0 0 15px rgba(0,255,204,0.3);
        }

        .top-stats {
            display: flex;
            gap: 24px;
        }

        .stat-display {
            background: rgba(0, 255, 204, 0.12);
            border: 1px solid rgba(0, 255, 204, 0.4);
            border-radius: 40px;
            padding: 6px 18px;
            display: flex;
            align-items: baseline;
            gap: 8px;
            backdrop-filter: blur(4px);
        }

        .stat-display .label {
            color: #a0b3d9;
            font-weight: 500;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-display .value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 6px #00ffcc;
        }

        .sound-controls {
            display: flex;
            gap: 12px;
        }

        .sound-btn {
            background: rgba(0, 255, 204, 0.15);
            border: 1px solid #00ffcc;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1.2rem;
            color: #00ffcc;
        }

        /* MAIN GAME AREA - Tight Grid, No Gaps */
        .game-area {
            flex: 1;
            display: flex;
            padding: 16px 20px;
            gap: 18px;
            min-height: 0;
            overflow: hidden;
        }

        /* LEFT PANEL - compact but spacious */
        .left-panel {
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex-shrink: 0;
        }

        .player-container {
            background: rgba(12, 16, 38, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 18px 12px;
            border: 1px solid rgba(0,255,204,0.25);
            flex: 1;
            overflow-y: auto;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .player-card {
            background: rgba(0, 0, 0, 0.45);
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid rgba(0,255,204,0.2);
            transition: 0.2s;
        }

        .player-card.active {
            border-color: #00ffcc;
            background: linear-gradient(145deg, rgba(0,255,204,0.1), rgba(0,0,0,0.4));
            box-shadow: 0 0 12px rgba(0,255,204,0.4);
        }

        .game-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-btn {
            background: rgba(20, 25, 55, 0.9);
            border: 1px solid #2a3a6a;
            border-radius: 40px;
            padding: 10px;
            font-weight: 600;
            transition: 0.2s;
            color: #c0e0ff;
        }

        /* BOARD CONTAINER - Zero margin, tight */
        .board-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 0;
        }

        .game-board {
            width: min(72vh, 85vw);
            height: min(72vh, 85vw);
            background: rgba(8, 12, 32, 0.8);
            border-radius: 28px;
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            grid-template-rows: repeat(11, 1fr);
            gap: 0px;  /* CLOSED GAPS */
            padding: 0px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.05);
            border: 2px solid #00ffcc55;
        }

        .board-space {
            background: linear-gradient(145deg, #141b38, #0c1128);
            border: 0.5px solid #2a3f6a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: 0.1s linear;
            padding: 4px;
            position: relative;
        }

        /* corner spaces have no extra gaps */
        .corner-space {
            grid-column: span 2;
            grid-row: span 2;
        }

        .space-icon {
            font-size: 1.6rem;
            filter: drop-shadow(0 2px 2px black);
        }
        .space-label {
            font-size: 0.65rem;
            font-weight: bold;
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 2px 4px;
            border-radius: 20px;
            margin-top: 2px;
        }

        /* Special types */
        .space-start { background: linear-gradient(145deg, #00cc88, #009966); }
        .space-grant { background: linear-gradient(145deg, #2b5f9e, #1e497a); }
        .space-obstacle { background: linear-gradient(145deg, #b91c1c, #7f1a1a); }
        .space-powerup { background: linear-gradient(145deg, #f59e0b, #b45309); }
        .space-investment { background: linear-gradient(145deg, #7e5bef, #5b3cc4); }
        .space-community { background: linear-gradient(145deg, #2d6a4f, #1e4a3a); }

        /* BOARD CENTER - perfect alignment */
        .board-center {
            grid-column: 3 / 10;
            grid-row: 3 / 10;
            background: radial-gradient(circle at 30% 20%, #0b0f2a, #030617);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid #00ffcc;
            box-shadow: inset 0 0 20px rgba(0,255,204,0.2), 0 8px 32px black;
            margin: 0; /* no gap */
        }

        .dice-container {
            display: flex;
            gap: 18px;
            margin: 12px 0;
        }

        .die {
            width: 55px;
            height: 55px;
            background: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            color: #0a0e27;
            box-shadow: 0 8px 0 #aaa;
        }

        .action-button {
            background: linear-gradient(95deg, #00e6b8, #00b894);
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            margin: 6px;
            transition: 0.1s;
        }

        /* RIGHT PANEL - No overflow gaps */
        .right-panel {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            flex-shrink: 0;
        }

        .card-display, .achievements-panel, .game-log {
            background: rgba(12, 16, 38, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 18px;
            border: 1px solid rgba(0,255,204,0.3);
        }

        .card-display {
            min-height: 240px;
        }

        .achievement-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .achievement-badge {
            background: rgba(0,255,204,0.1);
            border-radius: 40px;
            padding: 6px 12px;
            font-size: 1.2rem;
            opacity: 0.4;
            transition: 0.1s;
        }
        .achievement-badge.unlocked {
            opacity: 1;
            background: rgba(0,255,204,0.3);
            box-shadow: 0 0 6px #00ffcc;
        }

        .game-log {
            max-height: 220px;
            overflow-y: auto;
        }
        .log-entry {
            padding: 6px 10px;
            margin: 5px 0;
            background: #0a0e22;
            border-left: 3px solid #00ffcc;
            font-size: 0.8rem;
        }

        .player-token {
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1px solid white;
            box-shadow: 0 0 8px currentColor;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            z-index: 50;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #10142e;
            border-radius: 36px;
            max-width: 480px;
            width: 90%;
            padding: 28px;
            border: 2px solid #00ffcc;
            box-shadow: 0 25px 40px black;
        }

        /* toast */
        .notification-toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #0f172a;
            border-left: 5px solid #00ffcc;
            padding: 12px 24px;
            border-radius: 60px;
            color: #00ffcc;
            font-weight: bold;
            z-index: 2100;
            display: none;
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="top-bar">
        <div class="game-title" onclick="showAbout()">BLEUPrint™</div>
        <div class="top-stats">
            <div class="stat-display"><span class="label">Round</span><span class="value" id="roundNumber">1</span></div>
            <div class="stat-display"><span class="label">Turn</span><span class="value" id="currentTurn">Player 1</span></div>
            <div class="stat-display"><span class="label">Target</span><span class="value">100 WP</span></div>
        </div>
        <div class="sound-controls">
            <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
            <button class="sound-btn" onclick="showSettings()">⚙️</button>
            <button class="sound-btn" onclick="showHelp()">❓</button>
        </div>
    </div>

    <div class="game-area">
        <div class="left-panel">
            <div class="player-container"><h3 style="color:#00ffcc; margin-bottom:12px; text-align:center;">◈ PLAYERS ◈</h3><div id="playersList"></div></div>
            <div class="game-controls">
                <button class="control-btn" onclick="startNewGame()">🎮 NEW GAME</button>
                <button class="control-btn" onclick="addHumanPlayer()">➕ ADD PLAYER</button>
                <button class="control-btn" onclick="toggleAI()">🤖 ADD AI</button>
                <button class="control-btn" onclick="saveGame()">💾 SAVE</button>
                <button class="control-btn" onclick="loadGame()">📂 LOAD</button>
            </div>
        </div>

        <div class="board-container">
            <div class="game-board" id="gameBoard"></div>
        </div>

        <div class="right-panel">
            <div class="card-display"><div class="card-header" style="color:#00ffcc; font-weight:bold;">MISSION CONTROL</div><div class="card-content" id="cardContent"><p>⚡ Roll dice to begin journey</p></div><div id="cardActions"></div></div>
            <div class="achievements-panel"><h4 style="color:#00ffcc;">🏆 ACHIEVEMENTS</h4><div class="achievement-list" id="achievementList"></div></div>
            <div class="game-log"><h4 style="color:#00ffcc;">📋 ACTIVITY LOG</h4><div id="gameLog"></div></div>
        </div>
    </div>
</div>

<div class="modal" id="gameModal"><div class="modal-content"><div class="modal-header" id="modalHeader"></div><div class="modal-body" id="modalBody"></div><div class="modal-buttons"><button class="action-button" onclick="closeModal()">CONTINUE</button></div></div></div>
<div class="notification-toast" id="notificationToast"></div>

<script>
    // Audio
    let audioCtx = null, soundEnabled = true;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playSound(name) {
        if (!soundEnabled) return;
        try {
            initAudio();
            const s = { diceRoll:{freq:800,dur:80}, success:{freq:1200,dur:150}, failure:{freq:400,dur:200}, powerUp:{freq:1500,dur:100}, achievement:{freq:900,dur:300} }[name];
            if(!s) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = s.freq; osc.type = 'sine';
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + s.dur/1000);
            osc.start(); osc.stop(audioCtx.currentTime + s.dur/1000);
        } catch(e) {}
    }
    function toggleSound() { soundEnabled = !soundEnabled; document.getElementById('soundBtn').textContent = soundEnabled ? '🔊' : '🔇'; playSound('success'); }

    // Game State
    let gameState = {
        players: [], currentPlayer: 0, round: 1, board: [], gameActive: false, diceRolled: false, aiEnabled: true,
        statistics: { grantsCompleted:0, obstaclesOvercome:0, communitySpacesLanded:0, powerUpsCollected:0, investmentEarnings:0, totalGamesPlayed:0 }
    };
    let achievements = {
        firstGrant:{unlocked:false,name:'First Steps',icon:'🎯'}, wealthBuilder:{unlocked:false,icon:'💰'}, sovereign:{unlocked:false,icon:'👑'},
        speedRunner:{unlocked:false,icon:'⚡'}, survivor:{unlocked:false,icon:'🛡️'}, networker:{unlocked:false,icon:'🤝'}, powerPlayer:{unlocked:false,icon:'⭐'}, investor:{unlocked:false,icon:'📈'}
    };
    const missionCards = [
        { title:"Small Business Grant", desc:"SBA funding", resourceCost:2, wealthReward:15, successRate:70, learning:"SBIR grants" },
        { title:"Education Scholarship", resourceCost:1, wealthReward:10, successRate:60, learning:"FAFSA" },
        { title:"Community Dev Fund", resourceCost:2, wealthReward:20, successRate:85, learning:"Collective impact" },
        { title:"Tech Innovation", resourceCost:3, wealthReward:25, successRate:50, learning:"VC funding" },
        { title:"Green Energy Initiative", resourceCost:2, wealthReward:18, successRate:75, learning:"Renewable incentives" },
        { title:"Healthcare Innovation", resourceCost:3, wealthReward:22, successRate:55, learning:"NIH grants" },
        { title:"Youth Entrepreneurship", resourceCost:1, wealthReward:8, successRate:80, learning:"Youth funds" },
        { title:"Digital Literacy Grant", resourceCost:1, wealthReward:12, successRate:75, learning:"Digital divide" }
    ];
    const obstacleCards = [
        { title:"Credit Barrier", effect:"Lose 5 WP and skip turn", overcome:"Pay 3 Resources", learning:"Building credit", cost:3, penaltyWealth:5, skip:1 },
        { title:"Language Barrier", effect:"Lose 3 WP", overcome:"Pay 2 Resources", learning:"Accessibility", cost:2, penaltyWealth:3, skip:0 },
        { title:"Documentation", effect:"Skip next turn", overcome:"Pay 2 Resources", learning:"Bureaucracy", cost:2, skip:1, penaltyWealth:0 }
    ];
    const powerUpCards = [{ title:"Mentor Network", effect:"+15% success rate", duration:2 }];
    const boardLayout = [
        {type:'start',label:'START',icon:'🏁',corner:true},{type:'grant',label:'GRANT',icon:'📋'},{type:'community',label:'COMMUNITY',icon:'🤝'},{type:'grant',label:'GRANT',icon:'📋'},{type:'obstacle',label:'BARRIER',icon:'⚠️'},
        {type:'investment',label:'INVEST',icon:'💹'},{type:'grant',label:'GRANT',icon:'📋'},{type:'powerup',label:'POWER',icon:'⚡'},{type:'grant',label:'GRANT',icon:'📋'},{type:'community',label:'COMMUNITY',icon:'🤝'},{type:'investment',label:'FREE INV',icon:'💰',corner:true},
        {type:'grant',label:'GRANT',icon:'📋'},{type:'obstacle',label:'BARRIER',icon:'⚠️'},{type:'grant',label:'GRANT',icon:'📋'},{type:'powerup',label:'POWER',icon:'⚡'},{type:'investment',label:'INVEST',icon:'💹'},{type:'grant',label:'GRANT',icon:'📋'},{type:'community',label:'COMMUNITY',icon:'🤝'},{type:'grant',label:'GRANT',icon:'📋'},{type:'obstacle',label:'BARRIER',icon:'⚠️'},
        {type:'obstacle',label:'MAJOR',icon:'🚫',corner:true},{type:'grant',label:'GRANT',icon:'📋'},{type:'powerup',label:'POWER',icon:'⚡'},{type:'grant',label:'GRANT',icon:'📋'},{type:'investment',label:'INVEST',icon:'💹'},{type:'community',label:'COMMUNITY',icon:'🤝'},{type:'grant',label:'GRANT',icon:'📋'},{type:'obstacle',label:'BARRIER',icon:'⚠️'},{type:'grant',label:'GRANT',icon:'📋'},{type:'powerup',label:'POWER',icon:'⚡'},{type:'powerup',label:'MEGA',icon:'🌟',corner:true},
        {type:'grant',label:'GRANT',icon:'📋'},{type:'obstacle',label:'BARRIER',icon:'⚠️'},{type:'grant',label:'GRANT',icon:'📋'},{type:'community',label:'COMMUNITY',icon:'🤝'},{type:'investment',label:'INVEST',icon:'💹'},{type:'grant',label:'GRANT',icon:'📋'},{type:'powerup',label:'POWER',icon:'⚡'},{type:'grant',label:'GRANT',icon:'📋'},{type:'obstacle',label:'BARRIER',icon:'⚠️'}
    ];

    function createBoard() {
        const boardEl = document.getElementById('gameBoard');
        boardEl.innerHTML = '';
        boardLayout.forEach((space, idx) => {
            const div = document.createElement('div');
            div.className = `board-space space-${space.type}`;
            if (space.corner) div.classList.add('corner-space');
            let row=1, col=1;
            if (idx <= 10) { row = 1; col = idx+1; if(space.corner && idx===0) col=1; else if(idx===10){col=10; row=1;} }
            else if (idx <= 19) { row = idx-9; col = 11; }
            else if (idx <= 30) { row = 11; col = 31-idx; if(space.corner && idx===20) col=1; else if(idx===30){col=10; row=11;} }
            else { row = 41-idx; col = 1; }
            div.style.gridColumn = col; div.style.gridRow = row;
            div.innerHTML = `<div class="space-icon">${space.icon}</div><div class="space-label">${space.label}</div>`;
            div.onclick = () => showModal("Space Info", `<strong>${space.label}</strong><br>${space.type==='grant'?'Grant missions':space.type==='obstacle'?'Barriers':space.type==='powerup'?'Power-ups':space.type}`);
            boardEl.appendChild(div);
        });
        const centerDiv = document.createElement('div'); centerDiv.className = 'board-center';
        centerDiv.innerHTML = `<div class="center-logo" style="font-size:2rem;">BLEU</div><div class="dice-container" id="diceContainer"></div><div><button class="action-button" onclick="rollDice()">🎲 ROLL</button><button class="action-button secondary" onclick="endTurn()">⏭️ END TURN</button></div>`;
        boardEl.appendChild(centerDiv);
    }

    function initGame() {
        gameState.players = [{ name:"Player 1", color:"#00ffcc", wealth:10, resources:3, position:0, skipTurns:0, powerUps:[], isAI:false }];
        if(gameState.aiEnabled) gameState.players.push({ name:"AI", color:"#ff79c6", wealth:10, resources:3, position:0, skipTurns:0, powerUps:[], isAI:true });
        gameState.currentPlayer=0; gameState.round=1; gameState.gameActive=true; gameState.diceRolled=false;
        document.getElementById('gameLog').innerHTML = ''; addLogEntry("✨ New game started! Reach 100 WP.");
        updateDisplay(); placeTokens(); 
        showModal("BLEUPrint", "Roll the dice, complete grants, overcome barriers!");
    }

    function updateDisplay() {
        document.getElementById('roundNumber').innerText = gameState.round;
        if(gameState.players[gameState.currentPlayer]) document.getElementById('currentTurn').innerText = gameState.players[gameState.currentPlayer].name;
        const container = document.getElementById('playersList'); container.innerHTML = '';
        gameState.players.forEach((p, idx) => {
            const card = document.createElement('div'); card.className = `player-card ${idx===gameState.currentPlayer?'active':''}`;
            card.innerHTML = `<div><b>${p.name} ${p.isAI?'🤖':''}</b><span style="float:right;">${p.avatar}</span></div>
            <div>💰 ${p.wealth} WP &nbsp; 🧩 ${p.resources} res &nbsp; 📍${p.position}</div>`;
            container.appendChild(card);
        });
        placeTokens();
    }
    function placeTokens() {
        document.querySelectorAll('.player-token').forEach(t=>t.remove());
        gameState.players.forEach((player, idx) => {
            const space = document.getElementById(`space-${player.position}`) || document.querySelector(`.board-space`);
            if(space){
                const tok = document.createElement('div'); tok.className='player-token'; tok.style.background=player.color; tok.textContent = player.isAI?'🤖':idx+1;
                tok.style.bottom = '2px'; tok.style.right = `${idx*12}px`; tok.style.position = 'absolute';
                space.style.position = 'relative'; space.appendChild(tok);
            }
        });
    }
    function rollDice() {
        if(!gameState.gameActive) return showModal("Alert","Start a new game");
        if(gameState.diceRolled) return showModal("Info","Already rolled this turn");
        let p = gameState.players[gameState.currentPlayer];
        if(p.skipTurns > 0){ p.skipTurns--; addLogEntry(`⏭️ ${p.name} skips turn (${p.skipTurns} left)`); nextTurn(); return; }
        playSound('diceRoll');
        let dice1 = Math.floor(Math.random()*6)+1, dice2 = Math.floor(Math.random()*6)+1, total = dice1+dice2;
        const diceDiv = document.getElementById('diceContainer'); diceDiv.innerHTML = `<div class="die">${dice1}</div><div class="die">${dice2}</div>`;
        let oldPos = p.position;
        p.position = (p.position + total) % 40;
        if(p.position < oldPos){ p.wealth += 10; p.resources += 3; addLogEntry(`🏁 ${p.name} passed START +10 WP +3 res`); playSound('powerUp'); }
        addLogEntry(`🎲 ${p.name} rolled ${total} → landed on ${boardLayout[p.position]?.label}`);
        gameState.diceRolled = true;
        updateDisplay();
        handleSpace(boardLayout[p.position]);
        checkVictory();
        if(p.isAI && gameState.gameActive) setTimeout(()=>{ if(gameState.gameActive && gameState.currentCard) handleAIMove(); else if(!gameState.currentCard) endTurn(); }, 1500);
    }
    function handleSpace(space){
        const p = gameState.players[gameState.currentPlayer];
        const cardDiv = document.getElementById('cardContent'), actionsDiv = document.getElementById('cardActions');
        if(space.type === 'grant'){
            let mc = {...missionCards[Math.floor(Math.random()*missionCards.length)], type:'mission'};
            gameState.currentCard = mc;
            cardDiv.innerHTML = `<strong>${mc.title}</strong><br>${mc.desc}<br>🎯 Success:${mc.successRate}% | Cost:${mc.resourceCost} res → +${mc.wealthReward} WP`;
            if(!p.isAI) actionsDiv.innerHTML = `<button class="action-button" onclick="attemptMission()">ATTEMPT (${mc.resourceCost} res)</button><button class="action-button secondary" onclick="skipMission()">SKIP</button>`;
            else actionsDiv.innerHTML = '<i>AI deciding...</i>';
        }
        else if(space.type === 'obstacle'){
            let ob = {...obstacleCards[Math.floor(Math.random()*obstacleCards.length)], type:'obstacle'};
            gameState.currentCard = ob;
            cardDiv.innerHTML = `<span style="color:#ff8888">⚠️ ${ob.title}</span><br>${ob.effect}<br>💪 Overcome: ${ob.overcome}`;
            if(!p.isAI) actionsDiv.innerHTML = `<button class="action-button" onclick="overcomeObstacle()">OVERCOME (${ob.cost} res)</button><button class="action-button secondary" onclick="acceptObstacle()">ACCEPT</button>`;
        }
        else if(space.type === 'powerup'){
            let pu = powerUpCards[0]; p.powerUps.push(pu); p.resources += 2; gameState.statistics.powerUpsCollected++;
            cardDiv.innerHTML = `⚡ ${pu.title}! +2 Resources, ${pu.effect}`; actionsDiv.innerHTML=''; addLogEntry(`${p.name} gained ${pu.title}`);
            playSound('powerUp');
            gameState.currentCard = null;
        }
        else if(space.type === 'investment'){ let gain = Math.floor(Math.random()*15)+5; p.wealth+=gain; gameState.statistics.investmentEarnings+=gain; cardDiv.innerHTML=`💹 Investment +${gain} WP`; actionsDiv.innerHTML=''; addLogEntry(`${p.name} earned ${gain} WP from investment`); playSound('success'); }
        else if(space.type === 'community'){ p.wealth+=5; p.resources+=2; gameState.statistics.communitySpacesLanded++; cardDiv.innerHTML=`🤝 Community support +5 WP +2 res`; actionsDiv.innerHTML=''; addLogEntry(`${p.name} got community boost`); playSound('success'); }
        else if(space.type === 'start'){ cardDiv.innerHTML=`🏁 START BONUS: collected!`; actionsDiv.innerHTML=''; }
        updateDisplay();
    }
    function attemptMission(){
        let card = gameState.currentCard, p = gameState.players[gameState.currentPlayer];
        if(!card || card.type !== 'mission') return;
        if(p.resources < card.resourceCost) return showModal("Insufficient","Not enough resources");
        p.resources -= card.resourceCost;
        let successChance = card.successRate + (p.powerUps.length * 5);
        let roll = Math.random()*100;
        if(roll < successChance){
            p.wealth += card.wealthReward; gameState.statistics.grantsCompleted++;
            addLogEntry(`✅ ${p.name} succeeded +${card.wealthReward} WP`); playSound('success');
            if(gameState.statistics.grantsCompleted === 1) unlockAchievement('firstGrant');
        } else { addLogEntry(`❌ ${p.name} mission failed`); playSound('failure'); }
        document.getElementById('cardContent').innerHTML = roll<successChance ? "Mission completed!" : "Mission failed. Keep going!";
        document.getElementById('cardActions').innerHTML = '';
        gameState.currentCard = null;
        updateDisplay(); checkVictory();
    }
    function skipMission(){ gameState.currentCard = null; document.getElementById('cardContent').innerHTML = "Skipped"; document.getElementById('cardActions').innerHTML = ''; addLogEntry("Mission skipped"); }
    function overcomeObstacle(){
        let ob = gameState.currentCard, p = gameState.players[gameState.currentPlayer];
        if(p.resources >= ob.cost){ p.resources -= ob.cost; gameState.statistics.obstaclesOvercome++; addLogEntry(`💪 Overcame ${ob.title}`); playSound('success'); gameState.currentCard = null; document.getElementById('cardContent').innerHTML = "Obstacle cleared!"; document.getElementById('cardActions').innerHTML = ''; if(gameState.statistics.obstaclesOvercome===5) unlockAchievement('survivor'); }
        else showModal("Insufficient","Need resources");
        updateDisplay();
    }
    function acceptObstacle(){
        let ob = gameState.currentCard, p = gameState.players[gameState.currentPlayer];
        if(ob.penaltyWealth) p.wealth = Math.max(0, p.wealth - ob.penaltyWealth);
        if(ob.skip) p.skipTurns = ob.skip;
        addLogEntry(`😔 ${p.name} accepted penalty`); gameState.currentCard = null; document.getElementById('cardContent').innerHTML = "Penalty applied"; document.getElementById('cardActions').innerHTML = ''; updateDisplay();
    }
    function handleAIMove(){ if(gameState.currentCard?.type === 'mission') attemptMission(); else if(gameState.currentCard?.type === 'obstacle') overcomeObstacle(); else endTurn(); }
    function endTurn(){ if(!gameState.diceRolled && gameState.gameActive){ showModal("Roll first","Roll dice before ending turn"); return; } nextTurn(); }
    function nextTurn(){
        gameState.currentPlayer = (gameState.currentPlayer+1)%gameState.players.length;
        gameState.diceRolled = false;
        if(gameState.currentPlayer===0) gameState.round++;
        document.getElementById('cardContent').innerHTML = 'Roll dice to continue!'; document.getElementById('cardActions').innerHTML = ''; document.getElementById('diceContainer').innerHTML = '';
        updateDisplay();
        let nextP = gameState.players[gameState.currentPlayer];
        if(nextP && nextP.isAI && gameState.gameActive) setTimeout(()=>rollDice(), 1000);
    }
    function checkVictory(){
        let winner = gameState.players.find(p=>p.wealth >= 100);
        if(winner){ gameState.gameActive=false; showModal("🏆 VICTORY!", `${winner.name} reached 100 WP! Financial sovereignty achieved!`); unlockAchievement('sovereign'); if(gameState.round<=10) unlockAchievement('speedRunner'); }
    }
    function unlockAchievement(id){ if(achievements[id] && !achievements[id].unlocked){ achievements[id].unlocked=true; updateAchievementsUI(); showNotification(`🏆 ${achievements[id].icon} ${achievements[id].name} Unlocked!`); playSound('achievement'); } }
    function updateAchievementsUI(){ let list = document.getElementById('achievementList'); list.innerHTML = ''; Object.values(achievements).forEach(a=>{ let div = document.createElement('div'); div.className=`achievement-badge ${a.unlocked?'unlocked':''}`; div.innerHTML=a.icon; list.appendChild(div); }); }
    function addLogEntry(msg){ let logDiv = document.getElementById('gameLog'); let entry=document.createElement('div'); entry.className='log-entry'; entry.innerText=`${new Date().toLocaleTimeString()} ${msg}`; logDiv.prepend(entry); while(logDiv.children.length>20) logDiv.removeChild(logDiv.lastChild); }
    function showModal(title,msg){ document.getElementById('modalHeader').innerHTML=title; document.getElementById('modalBody').innerHTML=msg; document.getElementById('gameModal').classList.add('active'); }
    function closeModal(){ document.getElementById('gameModal').classList.remove('active'); }
    function showNotification(msg){ let toast = document.getElementById('notificationToast'); toast.innerText=msg; toast.style.display='block'; setTimeout(()=>toast.style.display='none', 2200); }
    function startNewGame(){ gameState = { players:[], currentPlayer:0, round:1, board:[], gameActive:false, diceRolled:false, aiEnabled:gameState.aiEnabled, statistics:{ grantsCompleted:0, obstaclesOvercome:0, communitySpacesLanded:0, powerUpsCollected:0, investmentEarnings:0, totalGamesPlayed:0 } }; createBoard(); initGame(); updateAchievementsUI(); }
    function addHumanPlayer(){ if(!gameState.gameActive) return showModal("Error","Start new game"); if(gameState.players.length>=6) return showModal("Max","Max 6 players"); let newP = { name:`Player ${gameState.players.length+1}`, color:`hsl(${Math.random()*360}, 70%, 60%)`, wealth:10, resources:3, position:0, skipTurns:0, powerUps:[], isAI:false }; gameState.players.push(newP); updateDisplay(); addLogEntry(`${newP.name} joined!`); playSound('success'); }
    function toggleAI(){ if(!gameState.gameActive) return showModal("Start Game","Start new game first"); let hasAI = gameState.players.some(p=>p.isAI); if(hasAI){ gameState.players = gameState.players.filter(p=>!p.isAI); if(gameState.currentPlayer >= gameState.players.length) gameState.currentPlayer=0; addLogEntry("AI removed"); } else { if(gameState.players.length<6) gameState.players.push({ name:"AI Bot", color:"#ff79c6", wealth:10, resources:3, position:0, skipTurns:0, powerUps:[], isAI:true }); addLogEntry("AI joined"); } updateDisplay(); placeTokens(); }
    function saveGame(){ localStorage.setItem('bleu_save', JSON.stringify({players:gameState.players, round:gameState.round, achievements, stats:gameState.statistics, currentPlayer:gameState.currentPlayer})); showNotification("Game saved!"); }
    function loadGame(){ let data = localStorage.getItem('bleu_save'); if(data){ let s=JSON.parse(data); gameState.players=s.players; gameState.round=s.round; gameState.currentPlayer=s.currentPlayer; gameState.statistics=s.stats; Object.assign(achievements,s.achievements); gameState.gameActive=true; gameState.diceRolled=false; updateDisplay(); updateAchievementsUI(); createBoard(); placeTokens(); showNotification("Game loaded!"); } else showModal("No save","No saved game"); }
    function showAbout(){ showModal("BLEUPrint Sovereign","Financial literacy board game. Reach 100 WP. Version 3.0 — Gaps closed. Full immersion."); }
    function showSettings(){ showModal("Settings",`Sound: ${soundEnabled?"ON":"OFF"} <button onclick="toggleSound()">Toggle</button><br>AI: ${gameState.aiEnabled?"Enabled":"Disabled"}<button onclick="toggleAI()">Toggle AI</button>`); }
    function showHelp(){ showModal("How to Play","Roll dice → Land on GRANT to attempt mission (spend resources). Land on BARRIER to overcome. Power-ups boost success. Pass START for bonus. First to 100 WP wins."); }
    createBoard(); initGame(); updateAchievementsUI();
</script>
</body>
</html>
